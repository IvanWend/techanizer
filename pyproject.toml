[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["techanizer"]

[project]
name = "techanizer"
version = "0.1.0"
description = "Techanizer: intelligent tech job-market analysis agent with LLM extraction, Postgres, pgvector, and DeepSeek."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "jupyterlab>=4.6.2",
    "langfuse>=4.14.5",
    "mcp>=1.29.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai>=2.24.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.52.1",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ISC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.33.0.20260712",
]
